name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# never run two releases at the same time, they would pick the same patch number
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for version + changelog

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: info
        run: bash .github/scripts/release-info.sh "$RUNNER_TEMP/CHANGELOG.md"

      - name: Build
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="${{ steps.info.outputs.version }}-pr.${{ github.event.number }}"
          else
            version="${{ steps.info.outputs.version }}"
          fi
          echo "Building $version"
          chmod +x gradlew
          # each folder is its own Gradle build; -P is passed to each of them directly
          ./gradlew -p client-fabric build -PreleaseVersion="$version" --no-configuration-cache
          ./gradlew -p server-paper build -PreleaseVersion="$version" --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: PocketShulker
          path: |
            client-fabric/build/libs/MXPocketShulker-fabric-*.jar
            server-paper/build/libs/PocketShulkerPaperBridge-*.jar
          if-no-files-found: error

      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.info.outputs.released != 'true' && steps.info.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          cat "$RUNNER_TEMP/CHANGELOG.md"
          gh release create "$TAG" \
            client-fabric/build/libs/MXPocketShulker-fabric-"$VERSION".jar \
            server-paper/build/libs/PocketShulkerPaperBridge-"$VERSION".jar \
            --target "$GITHUB_SHA" \
            --title "MX Pocket Shulker $VERSION" \
            --notes-file "$RUNNER_TEMP/CHANGELOG.md"

      - name: Upload to CurseForge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.info.outputs.released != 'true' && steps.info.outputs.relevant == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT: "1799700"
          FILE: client-fabric/build/libs/MXPocketShulker-fabric-${{ steps.info.outputs.version }}.jar
          DISPLAY_NAME: MX Pocket Shulker ${{ steps.info.outputs.version }}
          CHANGELOG_FILE: ${{ runner.temp }}/CHANGELOG.md
          MC_VERSION: ${{ steps.info.outputs.mc }}
          ENVIRONMENTS: Client,Server
          JAVA_VERSION: Java 25
          RELATIONS: '[{"slug":"fabric-api","type":"requiredDependency"}]'
        run: bash .github/scripts/curseforge-upload.sh
